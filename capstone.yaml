run: docker compose up -d && python -m uvicorn app.main:app --reload
seed: python -m app.seed
test: python -m pytest tests/ -v
base_url: http://127.0.0.1:8000
endpoints:
  - method: POST
    path: /generate
    description: Record a billable usage event (idempotent, quota-checked)
  - method: GET
    path: /usage
    description: Get current usage, plan limits, and cost for a tenant
  - method: POST
    path: /checkout
    description: Create a Stripe Checkout session for Free -> Pro upgrade
  - method: POST
    path: /webhooks/stripe
    description: Stripe webhook receiver (signature-verified, deduplicated)